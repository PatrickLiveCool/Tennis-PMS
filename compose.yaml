# Local Tennis foundation only. No housing API, workers, seed or production service.
name: tennis-pms-local
services:
  postgres:
    image: ${TENNIS_POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16-alpine}
    environment:
      POSTGRES_USER: tennis_dev
      POSTGRES_PASSWORD: tennis_local_only
      POSTGRES_DB: tennis_dev
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis_dev -d tennis_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - tennis-data:/var/lib/postgresql/data
      - ./scripts/tennis/init-databases.sql:/docker-entrypoint-initdb.d/010-tennis.sql:ro
volumes:
  tennis-data:
