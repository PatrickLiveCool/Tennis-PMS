name: Tennis PMS Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tennis-pms-release-please-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Prepare release PR
    if: github.repository == 'PatrickLiveCool/Tennis-PMS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check dedicated release credential
        shell: bash
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo '::error::Missing repository secret RELEASE_PLEASE_TOKEN. Configure a dedicated Tennis-PMS token with Contents and Pull requests write access, then run this workflow on main.'
            exit 1
          fi
      - name: Prepare version PR and draft release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
