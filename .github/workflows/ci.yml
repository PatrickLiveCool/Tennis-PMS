name: Tennis PMS CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tennis-pms-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-format:
    name: PR format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - name: Test and validate PR metadata
        run: |
          node --test scripts/check-pr-tests.mjs
          node scripts/check-pr.mjs

  check:
    name: Node and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tennis_dev
          POSTGRES_PASSWORD: tennis_local_only
          POSTGRES_DB: tennis_test
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U tennis_dev -d tennis_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
